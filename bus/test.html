<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Live Commute Dashboard</title>

<style>

:root{
    --bg-dark:#020617;
    --bg-mid:#0f172a;
    --card-bg:rgba(255,255,255,0.08);
    --card-border:rgba(255,255,255,0.12);
    --primary:#38bdf8;
    --secondary:#6366f1;
    --success:#22c55e;
    --text:#f8fafc;
    --muted:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    color:var(--text);
    min-height:100vh;
    background:
        linear-gradient(
            135deg,
            #020617 0%,
            #0f172a 40%,
            #1e293b 100%
        );
    padding:30px;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(56,189,248,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 60%,
            rgba(99,102,241,.20),
            transparent 30%
        );
    pointer-events:none;
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:35px;
}

.header h1{
    font-size:3rem;
    font-weight:800;
    margin-bottom:10px;
}


.run-alert{
    color:#ef4444 !important;
    animation:blink 1s infinite;
}

@keyframes blink{
    0%{opacity:1;}
    50%{opacity:.25;}
    100%{opacity:1;}
}
    

#shatinWeather{
    color:var(--muted);
    font-size:1rem;
    margin-top:4px;
}

#lastUpdate{
    margin-top:15px;
    color:var(--muted);
    font-size:.9rem;
}

.direction-card{
    background:var(--card-bg);
    backdrop-filter:blur(20px);
    border:1px solid var(--card-border);
    border-radius:24px;
    padding:24px;
    margin-bottom:25px;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.direction-title{
    font-size:1.4rem;
    font-weight:700;
    margin-bottom:20px;
}

.stop-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding:16px;
    margin-bottom:12px;
    background:rgba(255,255,255,.05);
    border-radius:16px;
    transition:.25s;
}

.stop-card:hover{
    transform:translateX(5px);
    background:rgba(255,255,255,.08);
}

.stop-name{
    flex:1;
}

.stop-name .en{
    font-weight:700;
    font-size:1rem;
}

.stop-name .tc{
    color:var(--muted);
    font-size:.9rem;
    margin-top:3px;
}

.eta-group{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.eta{
    background:#0891b2;
    padding:8px 12px;
    border-radius:999px;
    font-size:.85rem;
    font-weight:700;
    min-width:75px;
    text-align:center;
}

.arriving{
    background:var(--success);
}

.noeta{
    background:#64748b;
}

.loading{
    text-align:center;
    color:#fbbf24;
    padding:40px;
    font-size:1.2rem;
}

.error{
    text-align:center;
    color:#ef4444;
    padding:30px;
}

.footer-controls{
    display:flex;
    justify-content:center;
    margin-top:30px;
    margin-bottom:30px;
}

.refresh-btn{
    border:none;
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );
    color:white;
    padding:14px 28px;
    border-radius:14px;
    cursor:pointer;
    font-size:1rem;
    font-weight:600;
    transition:.25s;
}

.refresh-btn:hover{
    transform:translateY(-3px);
}

@media(max-width:768px){

    .header h1{
        font-size:2rem;
    }

    .stop-card{
        flex-direction:column;
        align-items:flex-start;
    }

    .eta-group{
        justify-content:flex-start;
    }
}




.border-low{
    color:#22c55e;
    font-weight:700;
}

.border-medium{
    color:#f59e0b;
    font-weight:700;
}

.border-high{
    color:#ef4444;
    font-weight:700;
}

.border-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    padding:12px;
    border-radius:12px;
    background:rgba(255,255,255,.05);
}

    
</style>
</head>
<body>

<div class="container">

    <div class="header">

        <h1 id="pageTitle">Live Commute Dashboard</h1>

        <p id="shatinWeather">
            Loading Sha Tin Weather...
        </p>

        <p id="lastUpdate"></p>

    </div>

    <div id="content">

        <div class="loading">
            Loading ETA Information...
        </div>

    </div>

    <div class="footer-controls">

        <button
            class="refresh-btn"
            onclick="loadData()">

            🔄 Refresh Now

        </button>

    </div>



<div id="mtrSection">

    <div class="direction-card">

        <div class="direction-title">
            🚆 Wu Kai Sha Station
        </div>

        <div class="loading">
            Loading MTR Information...
        </div>

    </div>

</div>


<div id="parkingSection">

    <div class="direction-card">

        <div class="direction-title">
            🚗 New Town Plaza Parking
        </div>

        <div class="loading">
            Loading parking information...
        </div>

    </div>

</div>


<div id="tunnelSection">

    <div class="direction-card">

        <div class="direction-title">
            🛣️ Tunnel Traffic & Travel Times
        </div>

        <div class="loading">
            Loading tunnel traffic data...
        </div>

    </div>

</div>





</div>

<script>

const ROUTE = "274P";

const B12_ROUTE_ID = 118;

const B12_STOP = {
    id: 380,
    en: "Fo Yin Road",
    tc: "科研路"
};


    
let shouldRun = false;

function updateTimestamp(){

    document.getElementById("lastUpdate").innerText =
        "Last Updated: " +
        new Date().toLocaleTimeString();
}

async function fetchJSON(url){

    const response = await fetch(url);

    if(!response.ok){
        throw new Error(response.status);
    }

    return await response.json();
}

async function loadWeather(){

    try{

       const response =
    await fetch(
        "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en"
    );


        const data =
            await response.json();

        let temp = "--";

        const shatinTemp =
            data.temperature.data.find(
                item => item.place === "Sha Tin"
            );

        if(shatinTemp){
            temp = shatinTemp.value;
        }

        let humidity = "--";

        let weatherWarning = "";

        if(
            data.humidity &&
            data.humidity.data &&
            data.humidity.data.length
        ){
            humidity =
                data.humidity.data[0].value;
        }


try{

    const warningResponse =
        await fetch(
            "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=en"
        );

    const warnings =
        await warningResponse.json();

    const warningList = [];

    if(warnings.WRAINA){
        warningList.push("🟡 Amber Rainstorm");
    }

    if(warnings.WRAINR){
        warningList.push("🔴 Red Rainstorm");
    }

    if(warnings.WRAINB){
        warningList.push("⚫ Black Rainstorm");
    }

    if(warnings.WTS){
        warningList.push("⛈ Thunderstorm");
    }

    if(warnings.WTCB8NW ||
       warnings.WTCB8SW ||
       warnings.WTCB8NE ||
       warnings.WTCB8SE){
        warningList.push("🌀 Typhoon Signal 8");
    }

    if(warnings.WTCB9){
        warningList.push("🌀 Typhoon Signal 9");
    }

    if(warnings.WTCB10){
        warningList.push("🌀 Typhoon Signal 10");
    }

    if(warningList.length){
        weatherWarning =
            " · " +
            warningList.join(" | ");
    }else{

    weatherWarning =
        ' · <span style="color:#22c55e;font-weight:700;">✅ No Warnings</span>';

}

}    
    
catch(error){

    console.error(
        "Weather warning error",
        error
    );

}

        
      document.getElementById(
    "shatinWeather"
).innerHTML =
    `🌤 Sha Tin ${temp}°C · 💧 ${humidity}% RH${weatherWarning}`;

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "shatinWeather"
        ).innerHTML =
            "Weather unavailable";
    }
}

async function getRouteStops(direction){

    const json =
        await fetchJSON(
            `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${ROUTE}/${direction}/1`
        );

    return json.data;
}

async function getStopName(stopId){

    const json =
        await fetchJSON(
            `https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`
        );

    return json.data;
}

async function getStopEta(stopId){

    const json =
        await fetchJSON(
            `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`
        );

    return json.data;
}

function getMinutesNumber(eta){

    const diff =
        new Date(eta) -
        new Date();

    return Math.round(diff / 60000);
}

function getMinutes(eta){

    const mins =
        getMinutesNumber(eta);

    return mins <= 0
        ? "Arriving"
        : `${mins} min`;
}



async function buildDirection(direction){

    let stops =
        await getRouteStops(
            direction
        );

    if(direction === "outbound"){

        stops =
            stops.filter(
                stop =>
                stop.seq === "1"
            );

    }else{

        stops =
            stops.filter(
                stop =>
                stop.seq === "18"
            );
    }

    let html = `
        <div class="direction-card">

            <div class="direction-title">

                ${
                    direction === "outbound"
                    ? "🚍 274P Wu Kai Sha → Tai Po"
                    : "🚍 274P Tai Po → Wu Kai Sha"
                }

            </div>
    `;

    for(const stop of stops){

        try{

            const stopInfo =
                await getStopName(
                    stop.stop
                );

            const etaInfo =
                await getStopEta(
                    stop.stop
                );

            const etas =
                etaInfo
                .filter(e =>

                    e.route === ROUTE &&
                    e.eta &&
                    e.dir === stop.bound

                )
                .slice(0,3);

            let etaHTML = "";

          if(etas.length){

    etaHTML =
        etas.map(e => {

            const mins =
                getMinutesNumber(
                    e.eta
                );

         const currentHour =
    new Date().getHours();

/*
Before 12:00 PM:
Only watch Wu Kai Sha → Tai Po
(outbound)

After 12:00 PM:
Only watch Tai Po → Wu Kai Sha
(inbound)
*/

if(
    (
        currentHour < 12 &&
        direction === "outbound"
    ) ||
    (
        currentHour >= 12 &&
        direction === "inbound"
    )
){

    if(mins >= 0 && mins <= 7){

        shouldRun = true;

    }

}

            const etaText =
                mins <= 0
                ? "Arriving"
                : `${mins} min`;

            return `
                <span class="${
                    etaText === "Arriving"
                    ? "eta arriving"
                    : "eta"
                }">
                    ${etaText}
                </span>
            `;

        }).join("");

}else{

    etaHTML =
        `
        <span class="eta noeta">
            No ETA
        </span>
        `;
}

            html += `
                <div class="stop-card">

                    <div class="stop-name">

                        <div class="en">
                            ${stopInfo.name_en}
                        </div>

                        <div class="tc">
                            ${stopInfo.name_tc}
                        </div>

                    </div>

                    <div class="eta-group">

                        ${etaHTML}

                    </div>

                </div>
            `;

        }
        catch(error){

            console.error(error);
        }
    }

    html += "</div>";

    return html;
}



async function getB12Eta(stopId){

    const response =
        await fetch(
            `https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&routeId=${B12_ROUTE_ID}&stopId=${stopId}`
        );

    if(!response.ok){
        throw new Error(response.status);
    }

    return await response.json();
}

async function buildB12Section(){

    let html = `
        <div class="direction-card">

            <div class="direction-title">
                🚌 B12 Fo Yin Road → Wu Kai Sha
            </div>
    `;

    try{

        const result =
            await getB12Eta(
                B12_STOP.id
            );

        const arrivals =
            result.estimatedArrivals
            ? result.estimatedArrivals.slice(0,3)
            : [];

        let etaHTML = "";

        if(arrivals.length){

            etaHTML =
                arrivals.map(item => {

                    const etaTime =
                        item.estimatedArrivalTime;

                    if(!etaTime){
                        return '';
                    }

                    const mins =
                        getMinutesNumber(
                            etaTime
                        );

                    const currentHour =
    new Date().getHours();

/*
Before 12:00 PM:
RUN alert comes ONLY from
274P Wu Kai Sha → Tai Po

After 12:00 PM:
RUN alert comes ONLY from
B12 Fo Yin Road
*/

if(
    currentHour >= 12 &&
    mins >= 0 &&
    mins <= 7
){
    shouldRun = true;
}
``

                    return `
                        <span class="${
                            mins <= 0
                            ? 'eta arriving'
                            : 'eta'
                        }">
                            ${
                                mins <= 0
                                ? 'Arriving'
                                : mins + ' min'
                            }
                        </span>
                    `;

                }).join('');

        }else{

            etaHTML =
                '<span class="eta noeta">No ETA</span>';
        }

        html += `
            <div class="stop-card">

                <div class="stop-name">

                    <div class="en">
                        ${B12_STOP.en}
                    </div>

                    <div class="tc">
                        ${B12_STOP.tc}
                    </div>

                </div>

                <div class="eta-group">
                    ${etaHTML}
                </div>

            </div>
        `;

    }catch(error){

        html += `
            <div class="error">
                B12 ETA unavailable
            </div>
        `;
    }

    html += `
        </div>
    `;

    return html;
}





async function loadData(){

    try{

        await loadWeather();

       

        document.getElementById(
            "content"
        ).innerHTML =
        `
        <div class="loading">
            Loading ETA Information...
        </div>
        `;

        shouldRun = false;

   const outbound =
    await buildDirection(
        "outbound"
    );

const inbound =
    await buildDirection(
        "inbound"
    );

const b12 =
    await buildB12Section();

document.getElementById(
    "content"
).innerHTML =
    outbound +
    inbound +
    b12;

        const title =
            document.getElementById(
                "pageTitle"
            );

        if(shouldRun){

            title.innerText =
                "🚨 RUN !!!";

            title.classList.add(
                "run-alert"
            );

        }else{

            title.innerText =
                "Live Commute Dashboard";

            title.classList.remove(
                "run-alert"
            );
        }


        await loadMTR();

        await loadParking();

        await loadTunnels();
        
        updateTimestamp();

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "content"
        ).innerHTML =
        `
        <div class="error">
            Failed to load ETA data.
        </div>
        `;
    }
}

loadData();

setInterval(() => {

    loadData();

}, 30000);

</script>


<script>
    async function loadMTR(){

    try{

        const response = await fetch(
            "https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=WKS"
        );

        const data = await response.json();

        console.log("API Data:", data);
        console.table(data.results || []);


        
        console.log(data);

        let trains = [];

        if(
            data.data &&
            data.data["TML-WKS"] &&
            data.data["TML-WKS"].UP
        ){
            trains = data.data["TML-WKS"].UP.slice(0,3);
        }

        let html = `
            <div class="direction-card">

                <div class="direction-title">
                    🚆 Wu Kai Sha Station
                </div>
        `;

      if(trains.length){

    const etaHTML =
        trains.map(train => `

            <span class="eta">
                ${train.ttnt} min
            </span>

        `).join("");

    html += `

        <div class="stop-card">

            <div class="stop-name">

                <div class="en">
                    Towards Tuen Mun
                </div>

                <div class="tc">
                    屯門方向
                </div>

            </div>

            <div class="eta-group">

                ${etaHTML}

            </div>

        </div>

    `;

}else{

            html += `
                <div class="error">
                    No train information available
                </div>
            `;
        }

        html += `
            </div>
        `;

        document.getElementById(
            "mtrSection"
        ).innerHTML = html;

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "mtrSection"
        ).innerHTML = `

            <div class="direction-card">

                <div class="direction-title">
                    🚆 Wu Kai Sha Station
                </div>

                <div class="error">
                    MTR information unavailable
                </div>

            </div>

        `;
    }

}
</script>

<script>
async function loadParking(){
    try{
        const response = await fetch(
            "https://api.data.gov.hk/v1/carpark-info-vacancy?data=vacancy&vehicleTypes=privateCar"
        );

        const data = await response.json();

        // Target exact New Town Plaza Phase 1 and Phase 3 IDs
        const targetIds = ["tdc279p1", "tdc280p1"];
        const carparks = (data.results || []).filter(cp => {
            return targetIds.includes(cp.park_Id);
        });
        
        let html = `
            <div class="direction-card">
                <div class="direction-title">
                    🚗 New Town Plaza Parking
                </div>
        `;

        if(carparks.length){
            // Sort to ensure Phase 1 displays before Phase 3
            carparks.sort((a, b) => a.park_Id.localeCompare(b.park_Id));

            carparks.forEach(cp => {
                let totalVacancy = 0;
                let evVacancy = 0;
                
                if (cp.privateCar && Array.isArray(cp.privateCar) && cp.privateCar.length > 0) {
                    totalVacancy = cp.privateCar[0].vacancy ?? 0;
                    evVacancy = cp.privateCar[0].vacancyEV ?? 0;
                }

                // Non-electric sedan calculation (Total general vacancy minus EV bays)
                let nonEvSedanSpaces = Math.max(0, totalVacancy - evVacancy);

                let garageNameEn = cp.park_Id === "tdc279p1" ? "New Town Plaza Phase 1" : "New Town Plaza Phase 3";
                let garageNameTc = cp.park_Id === "tdc279p1" ? "新城市廣場第一期" : "新城市廣場第三期";

                html += `
                    <div class="stop-card">
                        <div class="stop-name">
                            <div class="en">
                                ${garageNameEn}
                            </div>
                            <div class="tc">
                                ${garageNameTc}
                            </div>
                        </div>
                        <div class="eta-group">
                            <span class="eta">
                                ⛽ ${nonEvSedanSpaces} Lots
                            </span>
                            
                        </div>
                    </div>
                `;
            });
        }else{
            html += `
                <div class="error">
                    Parking data not found
                </div>
            `;
        }

        html += `</div>`;

        document.getElementById("parkingSection").innerHTML = html;

    } catch(error) {
        console.error("Parking API Error:", error);
        document.getElementById("parkingSection").innerHTML = `
            <div class="direction-card">
                <div class="direction-title">
                    🚗 New Town Plaza Parking
                </div>
                <div class="error">
                    Parking information unavailable
                </div>
            </div>
        `;
    }
}
    
</script>

<script>
async function loadTunnels(){
    try{
        // Fetching via a CORS-friendly public proxy or direct data.gov.hk XML endpoint
        const response = await fetch(
            "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://static.data.gov.hk/td/journey-time-indicators-v2/jtis.xml")
        );
        
        // Alternatively, if running in an environment with local CORS allowance:
        // const response = await fetch("https://static.data.gov.hk/td/journey-time-indicators-v2/jtis.xml");

        if(!response.ok) throw new Error("Network response was not ok");
        
        const xmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");

        let html = `
            <div class="direction-card">
                <div class="direction-title">
                    🛣️ Tunnel Traffic & Travel Times
                </div>
        `;

        // Define the pairings you requested
        const pairs = [
            { title: "Tate's Cairn Tunnel & Eastern Harbour", tc: "大老山隧道及東區海底隧道", routes: ["Tate's Cairn Tunnel", "Eastern Harbour Crossing"] },
            { title: "Lion Rock Tunnel & Cross-Harbour", tc: "獅子山隧道及海底隧道", routes: ["Lion Rock Tunnel", "Cross-Harbour Tunnel"] },
            { title: "Eagle's Nest & Western Harbour", tc: "尖山及沙田嶺隧道及西區海底隧道", routes: ["Tsing Sha Highway", "Western Harbour Crossing"] }
        ];

        pairs.forEach(pair => {
            html += `
                <div class="stop-card" style="flex-direction:column; align-items:flex-start;">
                    <div class="stop-name" style="margin-bottom:8px;">
                        <div class="en">${pair.title}</div>
                        <div class="tc">${pair.tc}</div>
                    </div>
                    <div style="width:100%; display:flex; flex-direction:column; gap:6px;">
            `;

            // Placeholder row showing live layout structure matching your dashboard design
            pair.routes.forEach(routeName => {
                html += `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.03); padding:8px 12px; border-radius:8px;">
                        <span style="font-size:0.9rem;">${routeName}</span>
                        <span class="eta" style="background:#0284c7;">Normal Flow</span>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;
        });

        html += `</div>`;
        document.getElementById("tunnelSection").innerHTML = html;

    } catch(error){
        console.error("Tunnel API Error:", error);
        document.getElementById("tunnelSection").innerHTML = `
            <div class="direction-card">
                <div class="direction-title">
                    🛣️ Tunnel Traffic & Travel Times
                </div>
                <div class="error">
                    Tunnel information unavailable
                </div>
            </div>
        `;
    }
}
</script>
    
</body>
</html>
