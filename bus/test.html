<!DOCTYPE html>
<html>
<body>
<pre id="out">Loading...</pre>

<script>

fetch("https://data.etabus.gov.hk/v1/transport/kmb/route-stop/274P/O/1")
.then(r => r.json())
.then(d => {
    document.getElementById("out").textContent =
        JSON.stringify(d,null,2);
})
.catch(err => {
    document.getElementById("out").textContent =
        err.toString();
});

</script>

</body>
</html>
