<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KMB Route 274P Live ETA</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    background: #0f172a;
}
</style>

</head>

<body class="bg-slate-900 text-white">

<div class="max-w-7xl mx-auto p-6">

    <h1 class="text-3xl font-bold mb-2">
        KMB 274P Live ETA
    </h1>

    <p class="text-slate-400 mb-6">
        Next 3 arrivals for all stops
    </p>

    <button
        onclick="loadRoute()"
        class="bg-cyan-600 px-4 py-2 rounded mb-6">
        Refresh
    </button>

    <div id="content">
        Loading...
    </div>

</div>

<script>

const ROUTE = "274P";
const SERVICE_TYPE = "1";

async function fetchJSON(url){

    const response = await fetch(url);

    if(!response.ok){
        throw new Error("HTTP " + response.status);
    }

    return await response.json();
}

async function getRouteStops(direction){

    const json = await fetchJSON(
        `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${ROUTE}/${direction}/${SERVICE_TYPE}`
    );

    return json.data;
}

async function getStop(stopId){

    const json = await fetchJSON(
        `https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`
    );

    return json.data;
}

async function getETA(stopId){

    const json = await fetchJSON(
        `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`
    );

    return json.data;
}

function formatETA(eta){

    const mins = Math.round(
        (new Date(eta) - new Date()) /
        60000
    );

    if(mins <= 0){
        return "Arriving";
    }

    return mins + " min";
}

async function buildDirection(direction){

    const stops = await getRouteStops(direction);

    let html = "";

    html += `
    <div class="mb-8">

        <h2 class="text-2xl font-bold mb-4">
            ${direction === "O" ? "Outbound" : "Inbound"}
        </h2>

        <div class="overflow-auto">

        <table class="w-full border">
            <thead>
                <tr class="bg-slate-800">
                    <th class="p-3">Seq</th>
                    <th class="p-3">Stop</th>
                    <th class="p-3">Next 3 Buses</th>
                </tr>
            </thead>

            <tbody>
    `;

    for(const stopRecord of stops){

        const stopId = stopRecord.stop;
        const seq = stopRecord.seq;

        try {

            const stopInfo =
                await getStop(stopId);

            const etaData =
                await getETA(stopId);

            const routeETA =
                etaData
                .filter(item =>
                    item.route === ROUTE &&
                    item.eta &&
                    item.dir === direction
                )
                .slice(0,3);

            let etaText = "No ETA";

            if(routeETA.length){

                etaText = routeETA
                    .map(item =>
                        formatETA(item.eta)
                    )
                    .join(" | ");
            }

            html += `
                <tr class="border-t border-slate-700">

                    <td class="p-3">
                        ${seq}
                    </td>

                    <td class="p-3">
                        ${stopInfo.name_tc}
                        <br>
                        <span class="text-xs text-slate-400">
                        ${stopInfo.name_en}
                        </span>
                    </td>

                    <td class="p-3 text-cyan-400">
                        ${etaText}
                    </td>

                </tr>
            `;

        } catch(error){

            console.error(error);
        }
    }

    html += `
            </tbody>
        </table>

        </div>

    </div>
    `;

    return html;
}

async function loadRoute(){

    const content =
        document.getElementById("content");

    try {

        content.innerHTML =
            "Loading route data...";

        const outbound =
            await buildDirection("O");

        const inbound =
            await buildDirection("I");

        content.innerHTML =
            outbound + inbound;

    } catch(error){

        console.error(error);

        content.innerHTML =
            `
            <div class="text-red-400">
                Error loading data.
                Check browser console (F12).
            </div>
            `;
    }
}

loadRoute();

</script>

</body>
</html>
