<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KMB 274P Live ETA</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}

h1{
    margin-bottom:5px;
}

h2{
    background:#1e293b;
    padding:10px;
    border-radius:6px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:30px;
}

th{
    background:#1e293b;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #334155;
}

tr:hover{
    background:#1e293b;
}

.badge{
    background:#0891b2;
    padding:4px 8px;
    border-radius:4px;
}

.loading{
    color:#fbbf24;
}

.error{
    color:#ef4444;
}

</style>

</head>
<body>

<h1>KMB Route 274P</h1>

<p>
Live ETA for 274P<br>
Auto refresh every 30 seconds
</p>

<button onclick="loadData()">
Refresh Now
</button>

<p id="lastUpdate"></p>

<div id="content">
Loading...
</div>

<script>

const ROUTE = "274P";

function updateTimestamp(){

    document.getElementById("lastUpdate").innerText =
        "Last Updated: " +
        new Date().toLocaleTimeString();
}

async function fetchJSON(url){

    const response = await fetch(url);

    if(!response.ok){

        throw new Error(
            response.status
        );
    }

    return await response.json();
}

async function getRouteStops(direction){

    const json =
        await fetchJSON(
            `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${ROUTE}/${direction}/1`
        );

    return json.data;
}

async function getStopName(stopId){

    const json =
        await fetchJSON(
            `https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`
        );

    return json.data;
}

async function getStopEta(stopId){

    const json =
        await fetchJSON(
            `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`
        );

    return json.data;
}

function getMinutes(eta){

    const diff =
        new Date(eta) -
        new Date();

    const mins =
        Math.round(diff/60000);

    return mins <= 0
        ? "Arriving"
        : mins + " min";
}

async function buildDirection(direction){

    let stops =
        await getRouteStops(direction);

    // Keep only specific stations

    if(direction === "outbound"){

        stops = stops.filter(
            stop => stop.seq === "1"
        );

    } else {

        stops = stops.filter(
            stop => stop.seq === "18"
        );
    }

    let html =
        `
        <h2>
        ${
            direction === "outbound"
            ? "Wu Kai Sha → Tai Po"
            : "Tai Po → Wu Kai Sha"
        }
        </h2>

        <table>

        <tr>
            <th>#</th>
            <th>Stop</th>
            <th>Next 3 Buses</th>
        </tr>
        `;

    for(const stop of stops){

        try{

            const stopInfo =
                await getStopName(stop.stop);

            const etaInfo =
                await getStopEta(stop.stop);

            const etas =
                etaInfo
                .filter(e=>

                    e.route === ROUTE &&
                    e.eta &&
                    e.dir === stop.bound

                )
                .slice(0,3);

            let etaText =
                "No ETA";

            if(etas.length){

                etaText =
                    etas
                    .map(
                        e=>getMinutes(
                            e.eta
                        )
                    )
                    .join(" | ");
            }

            html +=
                `
                <tr>

                <td>
                ${stop.seq}
                </td>

                <td>
                <b>
                ${stopInfo.name_en}
                </b>
                <br>
                ${stopInfo.name_tc}
                </td>

                <td>
                <span class="badge">
                ${etaText}
                </span>
                </td>

                </tr>
                `;

        }
        catch(err){

            console.error(err);
        }
    }

    html += "</table>";

    return html;
}

async function loadData(){

    try{

        document.getElementById("content")
            .innerHTML =
            "<p class='loading'>Loading data...</p>";

        const outbound =
            await buildDirection(
                "outbound"
            );

        const inbound =
            await buildDirection(
                "inbound"
            );

        document.getElementById("content")
            .innerHTML =
            outbound +
            inbound;

        updateTimestamp();

    }
    catch(error){

        console.error(error);

        document.getElementById("content")
            .innerHTML =
            `
            <p class="error">
                Error loading data.
                Open F12 console.
            </p>
            `;
    }
}

loadData();

setInterval(
    loadData,
    30000
);

</script>

</body>
</html>
