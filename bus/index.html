<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMB 274P Live Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Montserrat', 'sans-serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        amazing: {
                            gold: '#FBBF24',
                            cyan: '#06B6D4',
                            teal: '#14B8A6',
                            dark: '#0B132B',
                            card: '#1C2541',
                            accent: '#3A506B'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #070B19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(251, 191, 36, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .heading-font {
            font-family: 'Montserrat', sans-serif;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card-hover {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card-hover:hover {
            border-color: rgba(6, 182, 212, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -10px rgba(6, 182, 212, 0.15);
        }

        .text-gradient-gold {
            background: linear-gradient(135deg, #FFF 0%, #FBBF24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-gradient-cyan {
            background: linear-gradient(135deg, #38BDF8 0%, #06B6D4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glow-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.35);
        }

        .glow-gold {
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.35);
        }

        /* Pulse badge animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-12 antialiased selection:bg-cyan-500 selection:text-black">

    <header class="sticky top-0 z-50 glass-card border-b border-slate-800/80 mb-8">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                
                <!-- Team Branding -->
                <div class="flex items-center space-x-3">
                    <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-cyan-500 to-amber-400 p-0.5 shadow-lg shadow-cyan-500/20">
                        <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                            <i class="fa-solid fa-bus text-amber-400 text-xl"></i>
                        </div>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="heading-font font-black tracking-wider text-xs bg-amber-400/20 text-amber-300 border border-amber-400/30 px-2 py-0.5 rounded-full uppercase">
                                ALAN YIP
                            </span>
                            <span class="text-xs text-slate-400 font-semibold">• BUS SCHEDULES</span>
                        </div>
                        <h1 class="heading-font text-xl sm:text-2xl font-extrabold text-white tracking-tight flex items-center gap-2 mt-0.5">
                            KMB 274P <span class="text-gradient-cyan text-base sm:text-xl font-bold">LIVE TRACKER</span>
                        </h1>
                    </div>
                </div>

                <!-- Live Control Hub -->
                <div class="flex items-center space-x-3 self-end sm:self-auto">
                    <div class="text-right hidden sm:block">
                        <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Auto Refresh</div>
                        <div id="countdown-text" class="text-xs font-mono font-bold text-cyan-400">30s</div>
                    </div>

                    <button 
                        onclick="loadData()" 
                        id="refresh-btn"
                        class="flex items-center space-x-2 bg-gradient-to-r from-cyan-500 to-cyan-600 hover:from-cyan-400 hover:to-cyan-500 text-slate-950 font-bold text-xs uppercase tracking-wider px-4 py-2.5 rounded-xl shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/40 transition active:scale-95 cursor-pointer">
                        <i id="sync-icon" class="fa-solid fa-arrows-rotate"></i>
                        <span>REFRESH</span>
                    </button>
                </div>

            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6">

        <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-900/80 border border-slate-800 rounded-2xl p-4 mb-6 text-xs text-slate-300">
            <div class="flex items-center space-x-2">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-cyan-500"></span>
                </span>
                <span class="font-semibold text-slate-200">KMB Open Data Service Operational</span>
            </div>
            
            <div class="flex items-center space-x-4 font-mono text-slate-400">
                <span id="lastUpdate"><i class="fa-regular fa-clock mr-1"></i>Initializing...</span>
            </div>
        </div>

        <!-- Content Area -->
        <div id="content" class="space-y-8">
            <div class="glass-card rounded-2xl p-12 text-center">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-cyan-500/10 text-cyan-400 mb-4 animate-pulse-ring">
                    <i class="fa-solid fa-bus text-2xl"></i>
                </div>
                <h3 class="heading-font text-lg font-bold text-white mb-1">CONNECTING TO THE NETWORK</h3>
                <p class="text-xs text-slate-400">Fetching live ETA data for KMB 274P...</p>
            </div>
        </div>

    </main>

    <script>
    const ROUTE = "274P";
    const SERVICE_TYPE = "1";
    let autoRefreshTimer = null;
    let countdownSecs = 30;

    // Cache stop names to minimize API overhead
    const stopCache = new Map();

    function updateTimestamp(){
        const now = new Date();
        document.getElementById("lastUpdate").innerHTML = 
            `<i class="fa-regular fa-clock text-cyan-400 mr-1.5"></i>Updated: ${now.toLocaleTimeString()}`;
    }

    function startCountdown() {
        countdownSecs = 30;
        if (autoRefreshTimer) clearInterval(autoRefreshTimer);

        autoRefreshTimer = setInterval(() => {
            countdownSecs--;
            const countEl = document.getElementById("countdown-text");
            if (countEl) countEl.innerText = `${countdownSecs}s`;

            if (countdownSecs <= 0) {
                loadData();
            }
        }, 1000);
    }

    async function fetchJSON(url){
        try {
            const response = await fetch(url);
            if(!response.ok){
                throw new Error("HTTP " + response.status);
            }
            return await response.json();
        } catch(err) {
            console.error("API Fetch Error:", url, err);
            return null;
        }
    }

    async function getRouteStops(direction){
        const json = await fetchJSON(
            `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${ROUTE}/${direction}/${SERVICE_TYPE}`
        );
        return json?.data || [];
    }

    async function getStopName(stopId){
        if (stopCache.has(stopId)) {
            return stopCache.get(stopId);
        }
        const json = await fetchJSON(
            `https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`
        );
        const data = json?.data || { name_en: stopId, name_tc: stopId };
        stopCache.set(stopId, data);
        return data;
    }

    async function getStopEta(stopId){
        const json = await fetchJSON(
            `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`
        );
        return json?.data || [];
    }

    function formatETABadge(etaTimeStr){
        if (!etaTimeStr) return null;

        const etaDate = new Date(etaTimeStr);
        const diffMins = Math.round((etaDate - new Date()) / 60000);

        if (diffMins <= 0) {
            return `
                <span class="inline-flex items-center space-x-1 bg-gradient-to-r from-red-500/20 to-rose-500/20 text-rose-300 border border-rose-500/40 px-2.5 py-1 rounded-lg text-xs font-bold font-mono animate-pulse">
                    <i class="fa-solid fa-person-running text-[10px]"></i>
                    <span>ARRIVING 到達</span>
                </span>`;
        }

        const clock = etaDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

        if (diffMins <= 5) {
            return `
                <span class="inline-flex items-center space-x-1.5 bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-lg text-xs font-bold font-mono">
                    <i class="fa-solid fa-stopwatch text-[10px]"></i>
                    <span>${diffMins} min <span class="text-[10px] text-amber-400/70 font-sans">(${clock})</span></span>
                </span>`;
        }

        return `
            <span class="inline-flex items-center space-x-1.5 bg-cyan-500/10 text-cyan-300 border border-cyan-500/30 px-2.5 py-1 rounded-lg text-xs font-bold font-mono">
                <i class="fa-solid fa-bus text-[10px]"></i>
                <span>${diffMins} min <span class="text-[10px] text-cyan-400/60 font-sans">(${clock})</span></span>
            </span>`;
    }

    async function buildDirection(dirKey, title, subTitle, targetSeq){
        // Fetch all stops for direction (O = Outbound, I = Inbound)
        let stops = await getRouteStops(dirKey);

        if (!stops || stops.length === 0) {
            return `
            <div class="glass-card rounded-2xl p-6 text-center text-slate-400 text-xs">
                No route stop data available for ${title}.
            </div>`;
        }

        // Filter for target stop sequence (Seq 1 for Outbound, Seq 18 for Inbound)
        stops = stops.filter(stop => String(stop.seq) === String(targetSeq));

        // Use Promise.all to fetch stop info & ETA in parallel
        const stopItems = await Promise.all(
            stops.map(async (stop) => {
                const [stopInfo, etaData] = await Promise.all([
                    getStopName(stop.stop),
                    getStopEta(stop.stop)
                ]);

                // Filter ETAs for 274P
                const etas = etaData
                    .filter(e => e.route === ROUTE && e.eta)
                    .slice(0, 3);

                return {
                    seq: stop.seq,
                    info: stopInfo,
                    etas: etas
                };
            })
        );

        let rowsHtml = stopItems.map(item => {
            let etaBadges = `<span class="text-slate-500 text-xs font-mono">No Scheduled Buses</span>`;

            if (item.etas.length > 0) {
                etaBadges = item.etas
                    .map(e => formatETABadge(e.eta))
                    .filter(Boolean)
                    .join(" ");
            }

            return `
            <tr class="border-t border-slate-800/80 hover:bg-slate-800/40 transition-colors">
                <td class="p-4 text-center">
                    <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-slate-800 text-amber-400 font-mono font-black text-xs border border-slate-700">
                        ${item.seq}
                    </span>
                </td>
                <td class="p-4">
                    <div class="font-extrabold text-white text-base tracking-wide">${item.info.name_en || ''}</div>
                    <div class="text-xs text-cyan-400 font-bold mt-0.5">${item.info.name_tc || ''}</div>
                </td>
                <td class="p-4">
                    <div class="flex flex-wrap items-center gap-2">
                        ${etaBadges}
                    </div>
                </td>
            </tr>`;
        }).join('');

        return `
        <!-- Direction Card -->
        <div class="glass-card glass-card-hover rounded-2xl p-5 sm:p-6 shadow-xl">
            
            <!-- Header Banner -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-slate-950 font-extrabold shadow-md">
                        <i class="fa-solid fa-location-dot text-lg"></i>
                    </div>
                    <div>
                        <span class="text-[10px] font-black uppercase tracking-widest text-amber-400">${subTitle}</span>
                        <h2 class="heading-font text-lg sm:text-xl font-extrabold text-white">
                            ${title}
                        </h2>
                    </div>
                </div>

                <span class="bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 font-mono font-bold text-xs px-3 py-1 rounded-lg hidden sm:block">
                    SEQ #${targetSeq}
                </span>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 border-b border-slate-800">
                            <th class="p-3 text-center w-16">Stop #</th>
                            <th class="p-3">Station Name</th>
                            <th class="p-3">Next 3 Bus Departures</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/60">
                        ${rowsHtml}
                    </tbody>
                </table>
            </div>

        </div>`;
    }

    async function loadData(){
        const content = document.getElementById("content");
        const syncIcon = document.getElementById("sync-icon");

        if (syncIcon) syncIcon.classList.add("fa-spin");

        try {
            // Parallel fetches for Outbound (O) and Inbound (I)
            const [outboundHtml, inboundHtml] = await Promise.all([
                buildDirection("O", "Wu Kai Sha Station → Tai Po", "OUTBOUND • 烏溪沙站 → 大埔", "1"),
                buildDirection("I", "Tai Po Industrial Estate → Wu Kai Sha", "INBOUND • 大埔工業邨 → 烏溪沙", "18")
            ]);

            content.innerHTML = outboundHtml + inboundHtml;
            updateTimestamp();
            startCountdown();

        } catch (error) {
            console.error("Global load error:", error);
            content.innerHTML = `
                <div class="glass-card rounded-2xl p-8 border border-red-500/40 text-center text-red-300">
                    <i class="fa-solid fa-triangle-exclamation text-3xl mb-3 text-red-400"></i>
                    <h3 class="heading-font font-bold text-base text-white mb-1">TRACKER ERROR</h3>
                    <p class="text-xs text-slate-400">Unable to reach KMB servers. Please check your network connection.</p>
                </div>`;
        } finally {
            if (syncIcon) syncIcon.classList.remove("fa-spin");
        }
    }

    // Initial Load
    window.onload = function() {
        loadData();
    };
    </script>
</body>
</html>
