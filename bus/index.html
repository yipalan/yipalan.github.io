<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fo Yin Road Route 274P Full Schedule & Live ETA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; }
        .glow { box-shadow: 0 0 25px rgba(56, 189, 248, 0.12); }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-cyan-500 to-blue-600 p-2.5 rounded-xl shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-bus text-slate-900 text-xl font-bold"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">
                        274P
                    </h1>
                    <p class="text-xs text-slate-400 font-medium tracking-wider uppercase">
                        Fo Yin Road Station <span class="text-cyan-400 font-mono">(Pak Shek Kok)</span>
                    </p>
                </div>
            </div>

            <button onclick="loadArrivals()" class="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 hover:border-cyan-500/50 px-3.5 py-2 rounded-xl text-xs font-semibold transition active:scale-95">
                <i id="sync-icon" class="fa-solid fa-rotate"></i>
                <span>Refresh</span>
            </button>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6">
        
        <!-- Status Header -->
        <div class="bg-slate-800/70 border border-slate-700/80 rounded-2xl p-5 mb-6 glow flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                    <h2 class="text-lg font-bold text-slate-100">Fo Yin Road — Both Directions</h2>
                </div>
                <p class="text-xs text-slate-400 mt-1">Route: <span class="text-cyan-400 font-bold font-mono">274P</span> (Scheduled Timetable & Live ETA)</p>
            </div>
            <div class="text-xs text-slate-400 font-mono bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-700/60">
                Last Sync: <span id="sync-time" class="text-cyan-400">--:--:--</span>
            </div>
        </div>

        <!-- Bus Directions Container -->
        <div id="bus-list" class="space-y-6">
            <div class="py-12 text-center text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-cyan-400 mb-3"></i>
                <p class="text-sm">Fetching 274P schedules for both directions...</p>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        Team Amazing Platform • Live Data Stream & Official Timetable via KMB / data.gov.hk
    </footer>

    <script>
        // KMB Stop IDs for Fo Yin Road
        const KMB_STOP_IDS = ['002766', '003531'];
        const TARGET_ROUTE = '274P';

        // Official Fixed Timetable (Departure times from origin terminals)
        const FIXED_TIMETABLES = {
            'To Tai Po Industrial Estate': {
                dest_tc: '大埔工業邨',
                dest_en: 'Tai Po Industrial Estate',
                departures: [
                    '07:00', '07:15', '07:30', '07:45', 
                    '08:05', '08:25', '08:45', 
                    '09:15', '09:45', '10:15', 
                    '16:15', '17:15'
                ]
            },
            'To Wu Kai Sha Station': {
                dest_tc: '烏溪沙站',
                dest_en: 'Wu Kai Sha Station',
                departures: [
                    '07:00', 
                    '17:00', '17:15', '17:30', '17:45', 
                    '18:00', '18:30', '19:00', '20:00'
                ]
            }
        };

        async function fetchStopETA(stopId) {
            try {
                const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                if (!res.ok) return [];
                const json = await res.json();
                return json.data || [];
            } catch (e) {
                console.error("Fetch error for stop:", stopId, e);
                return [];
            }
        }

        async function loadArrivals() {
            const icon = document.getElementById('sync-icon');
            const list = document.getElementById('bus-list');
            if (icon) icon.classList.add('fa-spin');

            try {
                // Fetch real-time ETAs
                const rawResults = await Promise.all(KMB_STOP_IDS.map(id => fetchStopETA(id)));
                const allEtas = rawResults.flat();
                const route274pEtas = allEtas.filter(item => item.route === TARGET_ROUTE && item.eta);

                // Group live ETAs by destination
                const liveMap = {};
                route274pEtas.forEach(item => {
                    const dest = item.dest_tc || item.dest_en;
                    if (!liveMap[dest]) liveMap[dest] = [];
                    const etaDate = new Date(item.eta);
                    if (!liveMap[dest].some(d => d.getTime() === etaDate.getTime())) {
                        liveMap[dest].push(etaDate);
                    }
                });

                list.innerHTML = '';

                // Render schedules for BOTH directions
                Object.keys(FIXED_TIMETABLES).forEach(directionKey => {
                    const dirData = FIXED_TIMETABLES[directionKey];
                    const liveEtas = liveMap[dirData.dest_tc] || liveMap[dirData.dest_en] || [];
                    liveEtas.sort((a, b) => a - b);

                    const card = `
                        <div class="bg-slate-800/80 border border-slate-700 hover:border-slate-600 rounded-xl p-5 transition">
                            <!-- Direction Header -->
                            <div class="flex items-center justify-between border-b border-slate-700/60 pb-3 mb-4">
                                <div class="flex items-center space-x-3">
                                    <span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 px-3 py-1 rounded-lg text-2xl font-black font-mono">
                                        274P
                                    </span>
                                    <div>
                                        <div class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Direction 往</div>
                                        <div class="text-slate-100 font-bold text-base leading-tight">${dirData.dest_tc} (${dirData.dest_en})</div>
                                    </div>
                                </div>
                                ${liveEtas.length > 0 ? 
                                    `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-xs px-2.5 py-1 rounded-full font-bold flex items-center gap-1.5">
                                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live ETA Active
                                     </span>` : 
                                    `<span class="bg-slate-700/50 text-slate-400 border border-slate-600/40 text-xs px-2.5 py-1 rounded-full">
                                        Fixed Timetable
                                     </span>`
                                }
                            </div>

                            <!-- Live ETA Section (if active) -->
                            ${liveEtas.length > 0 ? `
                                <div class="mb-4">
                                    <div class="text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-2">Real-Time Next Departures</div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                                        ${liveEtas.map((etaTime, idx) => {
                                            const now = new Date();
                                            const diffMs = etaTime - now;
                                            const mins = Math.max(0, Math.round(diffMs / 60000));
                                            const clock = etaTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                                            
                                            let statusText = `${clock} (${mins} mins)`;
                                            let statusStyle = 'bg-cyan-500/20 text-cyan-300 border-cyan-500/30';

                                            if (mins <= 1) {
                                                statusText = `Arriving 到達 (${clock})`;
                                                statusStyle = 'bg-red-500/20 text-red-400 border-red-500/30';
                                            }

                                            return `
                                                <div class="flex items-center justify-between text-sm py-2 px-3 rounded-lg bg-slate-900/80 border border-emerald-500/40">
                                                    <span class="text-xs font-mono text-emerald-300 font-semibold">Live Bus ${idx + 1}</span>
                                                    <span class="text-xs font-bold font-mono px-2.5 py-1 rounded border ${statusStyle}">${statusText}</span>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            <!-- Full Daily Scheduled Departures -->
                            <div>
                                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Daily Departure Schedule (Origin Terminal Departure Times)</div>
                                <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
                                    ${dirData.departures.map(timeStr => `
                                        <div class="text-center py-2 px-1 rounded-lg bg-slate-900/50 border border-slate-700/50 text-xs font-mono font-medium text-slate-300">
                                            ${timeStr}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                    list.innerHTML += card;
                });

                const syncEl = document.getElementById('sync-time');
                if (syncEl) syncEl.innerText = new Date().toLocaleTimeString();

            } catch (err) {
                console.error(err);
                list.innerHTML = `
                    <div class="bg-red-950/30 border border-red-800/50 rounded-xl p-6 text-center text-red-300">
                        Unable to connect to live API stream. Please try again.
                    </div>`;
            } finally {
                if (icon) icon.classList.remove('fa-spin');
            }
        }

        // Initial Load
        loadArrivals();

        // Auto Refresh every 30 seconds
        setInterval(loadArrivals, 30000);
    </script>
</body>
</html>
