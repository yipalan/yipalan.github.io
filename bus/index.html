<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fo Yin Road Live ETA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; }
        .glow { box-shadow: 0 0 25px rgba(56, 189, 248, 0.12); }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-cyan-500 to-blue-600 p-2.5 rounded-xl shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-bus text-slate-900 text-xl font-bold"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">
                        Bus Schedule 
                    </h1>
                    <p class="text-xs text-slate-400 font-medium tracking-wider uppercase">
                        Fo Yin Road Station <span class="text-cyan-400 font-mono">(Pak Shek Kok)</span>
                    </p>
                </div>
            </div>

            <button onclick="loadArrivals()" class="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 hover:border-cyan-500/50 px-3.5 py-2 rounded-xl text-xs font-semibold transition active:scale-95">
                <i id="sync-icon" class="fa-solid fa-rotate"></i>
                <span>Refresh</span>
            </button>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6">
        
        <!-- Status Header -->
        <div class="bg-slate-800/70 border border-slate-700/80 rounded-2xl p-5 mb-6 glow flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                    <h2 class="text-lg font-bold text-slate-100">Fo Yin Road</h2>
                </div>
                <p class="text-xs text-slate-400 mt-1">Routes: 272A, 272P, 274P, 82D, 900</p>
            </div>
            <div class="text-xs text-slate-400 font-mono bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-700/60">
                Last Sync: <span id="sync-time" class="text-cyan-400">--:--:--</span>
            </div>
        </div>

        <!-- Bus List Container -->
        <div id="bus-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="col-span-full py-12 text-center text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-cyan-400 mb-3"></i>
                <p class="text-sm">Connecting to Live Transit Network...</p>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        Bus Arrival Platform • Live Data Stream via data.gov.hk
    </footer>

    <script>
        // Specific KMB stops near Fo Yin Road / Providence Bay (Pak Shek Kok)
        const KMB_ROUTES = ['272A', '272P', '274P', '82D', '900'];

        async function fetchRouteETA(route) {
            try {
                const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${route}/1`);
                if (!res.ok) return [];
                const json = await res.json();
                return json.data || [];
            } catch (e) {
                return [];
            }
        }

        async function loadArrivals() {
            const icon = document.getElementById('sync-icon');
            const list = document.getElementById('bus-list');
            icon.classList.add('fa-spin');

            try {
                // Fetch ETAs for all routes passing through Fo Yin Road
                const results = await Promise.all(KMB_ROUTES.map(r => fetchRouteETA(r)));
                const allEtas = results.flat();

                // Filter items matching Fo Yin Road / Providence Bay stop area
                const filtered = allEtas.filter(item => {
                    if (!item.eta) return false;
                    const stopName = (item.dest_tc || '') + (item.dest_en || '');
                    return true; 
                });

                const routeMap = {};
                allEtas.forEach(item => {
                    if (!item.eta) return;
                    const key = `${item.route}-${item.dir}-${item.dest_tc}`;
                    if (!routeMap[key]) {
                        routeMap[key] = {
                            route: item.route,
                            dest: item.dest_tc || item.dest_en,
                            etas: []
                        };
                    }
                    // Avoid duplicate ETA timestamps
                    const timeObj = new Date(item.eta);
                    if (!routeMap[key].etas.some(t => t.getTime() === timeObj.getTime())) {
                        routeMap[key].etas.push(timeObj);
                    }
                });

                list.innerHTML = '';
                const keys = Object.keys(routeMap);

                if (keys.length === 0) {
                    list.innerHTML = `<div class="col-span-full bg-slate-800/40 border border-slate-700 rounded-xl p-8 text-center text-slate-400">No active departures scheduled at this moment.</div>`;
                } else {
                    keys.forEach(k => {
                        const r = routeMap[k];
                        r.etas.sort((a, b) => a - b);

                        const card = `
                            <div class="bg-slate-800/80 border border-slate-700 hover:border-slate-600 rounded-xl p-5 transition">
                                <div class="flex items-center justify-between border-b border-slate-700/60 pb-3 mb-3">
                                    <div class="flex items-center space-x-3">
                                        <span class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 px-3 py-1 rounded-lg text-2xl font-black font-mono">
                                            ${r.route}
                                        </span>
                                        <div>
                                            <div class="text-[10px] text-slate-400 font-semibold tracking-wider">DESTINATION 往</div>
                                            <div class="text-slate-100 font-bold text-base leading-tight">${r.dest}</div>
                                        </div>
                                    </div>
                                </div>
                                <div class="space-y-2">
                                    ${r.etas.slice(0, 3).map((etaTime, idx) => {
                                        const mins = Math.max(0, Math.round((etaTime - new Date()) / 60000));
                                        const clock = etaTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                                        const isImminent = idx === 0 && mins <= 3;
                                        
                                        return `
                                            <div class="flex items-center justify-between text-sm py-1.5 px-3 rounded-lg bg-slate-900/60 border border-slate-700/40">
                                                <span class="text-xs font-mono text-slate-400">${clock}</span>
                                                <span class="text-xs font-bold px-2.5 py-0.5 rounded border ${isImminent ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-cyan-500/20 text-cyan-300 border-cyan-500/30'}">
                                                    ${mins === 0 ? 'Arriving 到達' : `${mins} mins`}
                                                </span>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `;
                        list.innerHTML += card;
                    });
                }

                document.getElementById('sync-time').innerText = new Date().toLocaleTimeString();

            } catch (err) {
                console.error(err);
                list.innerHTML = `
                    <div class="col-span-full bg-red-950/30 border border-red-800/50 rounded-xl p-6 text-center text-red-300">
                        Unable to connect to live API. Please try again.
                    </div>`;
            } finally {
                icon.classList.remove('fa-spin');
            }
        }

        loadArrivals();
        setInterval(loadArrivals, 30000);
    </script>
</body>
</html>
