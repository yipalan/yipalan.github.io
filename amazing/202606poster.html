<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Amazing HK - 2026 沙田龍舟競渡</title>
    <style>
        /* CSS Reset & Variable Definitions */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-yellow: #CCFF00;
            --electric-blue: #00CCFF;
            --text-white: #FFFFFF;
            --text-muted: #E0E0E0;
        }

        /* Print Optimization Rules */
        @media print {
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }

        /* Canvas Setup for A4 Dimensions */
        body {
            font-family: 'Impact', 'Arial Black', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 210mm;
            height: 297mm;
            background-image: url('motion_photo_6531105047120360541.jpg');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            overflow: hidden;
            position: relative;
        }

        /* Lower Graphical Gradient Banner */
        .poster-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 52%;
            background: linear-gradient(to top, 
                rgba(6, 17, 32, 0.98) 0%, 
                rgba(6, 17, 32, 0.95) 60%, 
                rgba(6, 17, 32, 0.75) 85%, 
                rgba(6, 17, 32, 0.0) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 0 45px 35px 45px;
            text-align: center;
        }

        /* Dynamic Angled Slash Accents */
        .slash-accent {
            position: absolute;
            top: 12%;
            width: 120%;
            height: 24px;
            background: linear-gradient(90deg, transparent 10%, var(--primary-yellow) 30%, var(--electric-blue) 70%, transparent 90%);
            transform: rotate(-12deg);
            z-index: 2;
            opacity: 0.9;
        }

        .slash-accent.secondary {
            top: 14%;
            height: 8px;
            opacity: 0.6;
            transform: rotate(-12deg) translateY(10px);
        }

        /* Typography Styling */
        .main-title {
            font-size: 72px;
            font-weight: 900;
            font-style: italic;
            color: var(--text-white);
            letter-spacing: -1px;
            line-height: 1.0;
            margin-bottom: 12px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .sub-taglines {
            font-size: 19px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: 1px;
            color: var(--text-white);
            margin-bottom: 35px;
            word-spacing: 3px;
        }

        .event-title {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            font-size: 42px;
            font-weight: bold;
            color: var(--text-white);
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .event-title .highlight {
            color: var(--primary-yellow);
        }

        .event-date {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            font-size: 28px;
            font-weight: bold;
            color: var(--text-white);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .event-location {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: var(--electric-blue);
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .scripture-box {
            font-family: "MingLiU", "PMingLiU", "Microsoft JhengHei", serif;
            max-width: 85%;
            text-align: right;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .scripture-text {
            font-size: 17px;
            line-height: 1.6;
            text-align: justify;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .scripture-ref {
            font-size: 15px;
            letter-spacing: 1px;
        }

        /* Social Branding Footer */
        .footer-brand {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #A0A0A0;
            padding-left: 10px;
        }

        .instagram-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-radius: 5px;
            margin-right: 8px;
            position: relative;
        }
        
        .instagram-icon::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border: 2px solid white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
        }
    </style>
</head>
<body>

    <div class="poster-overlay">
        
        <div class="slash-accent"></div>
        <div class="slash-accent secondary"></div>

        <h1 class="main-title">WE ARE AMAZING.</h1>
        <div class="sub-taglines">AMAZING ONE | AMAZING ONE | AMAZING ALL IN ONE</div>

        <h2 class="event-title">2026 <span class="highlight">沙田龍舟競渡</span></h2>
        <div class="event-date">端午節決賽 | 6月19日</div>
        <div class="event-location">沙田城門河 | SHING MUN RIVER</div>

        <div class="scripture-box">
            <p class="scripture-text">「但那等候耶和華的必從新得力。他們必如鷹展翅上騰；他們奔跑卻不困倦，行走卻不疲乏。」</p>
            <p class="scripture-ref">— 以賽亞書 40:31</p>
        </div>

        <div class="footer-brand">
            <span class="instagram-icon"></span>
            <span>@TEAMAMAZINGHK</span>
        </div>
    </div>

</body>
</html>
